<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Posts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal min-h-screen">

    <!-- Top Navigation Bar -->
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <!-- Dashboard Logo / Title -->
            <div class="text-xl font-bold tracking-wide flex items-center gap-2">
                <i class="fa-solid fa-gauge-high text-indigo-400"></i> Admin Dashboard
            </div>
            
            <!-- Navigation Links -->
            <div class="flex space-x-2">
                <a href="index.html" class="bg-slate-800 text-white px-4 py-2 rounded-md text-sm font-medium border-b-2 border-indigo-500">
                    <i class="fa-solid fa-newspaper mr-1"></i> Posts
                </a>
                <a href="users.html" class="text-gray-300 hover:bg-slate-800 hover:text-white px-4 py-2 rounded-md text-sm font-medium transition">
                    <i class="fa-solid fa-users mr-1"></i> Users
                </a>
                <a href="1000likes.html" class="text-gray-300 hover:bg-slate-800 hover:text-white px-4 py-2 rounded-md text-sm font-medium transition">
                    <i class="fa-solid fa-heart text-red-500 mr-1"></i> 1000+ Likes
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container mx-auto mt-8 px-4">
        
        <!-- Header & Action Button -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">All Posts</h1>
                <p class="text-sm text-gray-500">Manage, edit, and moderate community posts.</p>
            </div>
            <button onclick="addPost()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg flex items-center gap-2 shadow transition">
                <i class="fa-solid fa-plus"></i> New Post
            </button>
        </div>

        <!-- Posts Table Card -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 text-left">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3.5 text-xs font-semibold text-gray-500 uppercase">ID</th>
                            <th class="px-6 py-3.5 text-xs font-semibold text-gray-500 uppercase">Post Title</th>
                            <th class="px-6 py-3.5 text-xs font-semibold text-gray-500 uppercase">Author</th>
                            <th class="px-6 py-3.5 text-xs font-semibold text-gray-500 uppercase">Likes</th>
                            <th class="px-6 py-3.5 text-xs font-semibold text-gray-500 uppercase text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="postsTableBody" class="divide-y divide-gray-200">
                        <!-- JavaScript will populate post rows here -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // Sample Data
        let posts = [
            { id: 1, title: 'Top Web Development Trends in 2026', author: 'Alex Johnson', likes: 1420 },
            { id: 2, title: 'Getting Started with Tailwind CSS', author: 'Sarah Connor', likes: 850 },
            { id: 3, title: 'Mastering JavaScript Async/Await', author: 'Mike Ross', likes: 2150 },
            { id: 4, title: 'UI/UX Design Best Practices for Dashboards', author: 'Elena Rostova', likes: 430 }
        ];

        // Function to render posts inside the table
        function renderPosts() {
            const tbody = document.getElementById('postsTableBody');
            tbody.innerHTML = '';

            if (posts.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                            No posts found.
                        </td>
                    </tr>
                `;
                return;
            }

            posts.forEach(post => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors';
                tr.innerHTML = `
                    <td class="px-6 py-4 text-sm font-mono text-gray-500">#${post.id}</td>
                    <td class="px-6 py-4 text-sm font-semibold text-gray-900">${escapeHtml(post.title)}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${escapeHtml(post.author)}</td>
                    <td class="px-6 py-4 text-sm">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-red-50 text-red-600 border border-red-200">
                            <i class="fa-solid fa-heart mr-1.5"></i> ${post.likes.toLocaleString()}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-right space-x-2">
                        <button onclick="editPost(${post.id})" class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-md font-medium text-xs transition">
                            <i class="fa-solid fa-pen mr-1"></i> Edit
                        </button>
                        <button onclick="deletePost(${post.id})" class="text-red-600 hover:text-red-900 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-md font-medium text-xs transition">
                            <i class="fa-solid fa-trash mr-1"></i> Delete
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Delete post function
        function deletePost(id) {
            if (confirm('Are you sure you want to delete this post?')) {
                posts = posts.filter(post => post.id !== id);
                renderPosts();
            }
        }

        // Edit post function
        function editPost(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;

            const newTitle = prompt('Edit Post Title:', post.title);
            if (newTitle !== null && newTitle.trim() !== '') {
                post.title = newTitle.trim();
                renderPosts();
            }
        }

        // Add post function
        function addPost() {
            const title = prompt('Enter new post title:');
            if (!title || title.trim() === '') return;
            
            const author = prompt('Enter author name:', 'Admin');
            
            const newPost = {
                id: posts.length ? Math.max(...posts.map(p => p.id)) + 1 : 1,
                title: title.trim(),
                author: author ? author.trim() : 'Admin',
                likes: 0
            };
            
            posts.push(newPost);
            renderPosts();
        }

        // Security helper to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        // Initial Load
        renderPosts();
    </script>
</body>
</html>
