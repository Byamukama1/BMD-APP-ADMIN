<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BMD Admin Dashboard</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body style="background-color: #f4f6f5;">

<!-- Admin Header -->
<header class="app-header" style="background: linear-gradient(135deg, #0d1b12, #142e1f);">
    <div class="brand">
        <h1>BMD ADMIN PANEL</h1>
        <span class="sub">Control & Management Center</span>
    </div>
    <div class="actions">
        <button class="header-icon-btn" onclick="window.location.href='icon.html'" title="Icons"><i class="fas fa-icons"></i></button>
    </div>
</header>

<!-- Top Navigation Bar -->
<div style="display: flex; gap: 8px; padding: 10px 14px; background: #ffffff; border-bottom: 1px solid #e0e0e0; overflow-x: auto; white-space: nowrap;">
    <button onclick="window.location.href='users.html'" style="padding: 8px 14px; background: var(--bmd-primary); color: #fff; border: none; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
        <i class="fas fa-users"></i> Users Panel
    </button>
    <button onclick="window.location.href='1000likes.html'" style="padding: 8px 14px; background: var(--bmd-gold); color: var(--bmd-dark); border: none; border-radius: 20px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
        <i class="fas fa-heart"></i> 1000 Likes Club
    </button>
    <button onclick="window.location.href='icon.html'" style="padding: 8px 14px; background: #e8e0d2; color: var(--bmd-primary-dark); border: none; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
        <i class="fas fa-icons"></i> Icon Panel
    </button>
</div>

<!-- Main Feed Layout -->
<main class="feed-container" style="margin-top: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="font-size: 1.05rem; font-family: 'Playfair Display', serif; color: var(--bmd-primary);">Live Firestore Posts</h3>
        <span id="postCountBadge" style="background: var(--bmd-gold); color: var(--bmd-dark); font-weight: 800; font-size: 0.75rem; padding: 3px 10px; border-radius: 12px;">0 Posts</span>
    </div>

    <!-- Live Firestore Posts List -->
    <div id="adminPostsFeed">
        <div style="text-align:center; padding:30px; color:#666;">
            <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; color: var(--bmd-gold);"></i>
            <p style="margin-top:8px; font-size: 0.85rem;">Connecting to Firestore...</p>
        </div>
    </div>
</main>

<!-- Popup Modal for Editing Posts -->
<div id="editModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:3000; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:14px; width:100%; max-width:500px; padding:18px; box-shadow:0 4px 20px rgba(0,0,0,0.3);">
        <h3 style="margin-bottom:12px; color:var(--bmd-primary); font-size:1.1rem;">Edit Post</h3>
        <input type="hidden" id="editPostId" />
        <label style="font-size:0.75rem; font-weight:700; color:#555;">Title</label>
        <input type="text" id="editPostTitle" style="width:100%; padding:8px; margin:4px 0 12px; border:1px solid #ccc; border-radius:8px; font-size:0.9rem;" />
        <label style="font-size:0.75rem; font-weight:700; color:#555;">Content</label>
        <textarea id="editPostContent" rows="4" style="width:100%; padding:8px; margin:4px 0 14px; border:1px solid #ccc; border-radius:8px; font-size:0.85rem;"></textarea>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button onclick="closeEditModal()" style="padding:8px 14px; background:#ccc; border:none; border-radius:8px; font-weight:600; cursor:pointer;">Cancel</button>
            <button onclick="savePostEdit()" style="padding:8px 14px; background:var(--bmd-primary); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer;">Save Changes</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 1. Firebase Config Setup
const firebaseConfig = {
    apiKey: "AIzaSyC-PINF2AJcETYIMINiCfT0gSxLxw70vSE",
    authDomain: "bmd-app-1aec8.firebaseapp.com",
    projectId: "bmd-app-1aec8",
    storageBucket: "bmd-app-1aec8.firebasestorage.app",
    messagingSenderId: "722780031230",
    appId: "1:722780031230:web:cd19a98e24e4d9d80dfdaf"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const db = firebase.firestore();
let loadedPosts = [];

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
}

// 2. Real-time Firestore Listener
function listenToAdminPosts() {
    db.collection('posts')
      .orderBy('createdAt', 'desc')
      .onSnapshot(snapshot => {
          loadedPosts = [];
          snapshot.forEach(doc => {
              loadedPosts.push({ id: doc.id, ...doc.data() });
          });
          document.getElementById('postCountBadge').textContent = `${loadedPosts.length} Posts`;
          renderAdminPosts(loadedPosts);
      }, error => {
          console.error("Firestore read error:", error);
          showToast("⚠️ Failed to load Firestore data");
      });
}

// 3. Render Firestore Posts with Likes & Buttons
function renderAdminPosts(posts) {
    const feed = document.getElementById('adminPostsFeed');
    if (posts.length === 0) {
        feed.innerHTML = `<div style="text-align:center; padding:30px; color:#666;">No posts found in database.</div>`;
        return;
    }

    let html = '';
    posts.forEach(post => {
        const title = escapeHtml(post.title || 'Untitled Post');
        const content = escapeHtml(post.content || post.preview || '');
        const author = escapeHtml(post.authorName || 'Community Voice');
        const likes = post.likes || 0;

        html += `
        <div style="background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 2px 6px rgba(0,0,0,0.06); border:1px solid #e2e8e4;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span style="font-size:0.75rem; font-weight:700; color:var(--bmd-primary);"><i class="fas fa-user"></i> ${author}</span>
                <span style="font-size:0.75rem; font-weight:800; color:#e74c3c; background:#fdeae8; padding:3px 8px; border-radius:10px;">
                    <i class="fas fa-heart"></i> ${likes} Likes
                </span>
            </div>
            <h4 style="font-family:'Playfair Display',serif; font-size:1rem; margin-bottom:4px; color:#111;">${title}</h4>
            <p style="font-size:0.8rem; color:#555; margin-bottom:10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${content}</p>
            <div style="display:flex; gap:8px; justify-content:flex-end; border-top:1px solid #f0f0f0; padding-top:8px;">
                <button onclick="openEditModal('${post.id}')" style="background:#f0d080; color:#0f261b; border:none; padding:6px 12px; border-radius:6px; font-size:0.75rem; font-weight:700; cursor:pointer;">
                    <i class="fas fa-edit"></i> Edit
                </button>
                <button onclick="deletePost('${post.id}')" style="background:#e74c3c; color:#fff; border:none; padding:6px 12px; border-radius:6px; font-size:0.75rem; font-weight:700; cursor:pointer;">
                    <i class="fas fa-trash-alt"></i> Delete
                </button>
            </div>
        </div>`;
    });
    feed.innerHTML = html;
}

// 4. Delete Post directly from Firestore
async function deletePost(postId) {
    if (confirm("Are you sure you want to permanently delete this post from Firestore?")) {
        try {
            await db.collection('posts').doc(postId).delete();
            showToast("🗑️ Post deleted!");
        } catch (err) {
            console.error("Delete error:", err);
            showToast("❌ Failed to delete");
        }
    }
}

// 5. Open & Save Edit Modal to Firestore
function openEditModal(postId) {
    const post = loadedPosts.find(p => p.id === postId);
    if (!post) return;
    document.getElementById('editPostId').value = post.id;
    document.getElementById('editPostTitle').value = post.title || '';
    document.getElementById('editPostContent').value = post.content || post.preview || '';
    document.getElementById('editModal').style.display = 'flex';
}

function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
}

async function savePostEdit() {
    const postId = document.getElementById('editPostId').value;
    const newTitle = document.getElementById('editPostTitle').value.trim();
    const newContent = document.getElementById('editPostContent').value.trim();

    if (!newTitle) {
        showToast("Title is required");
        return;
    }

    try {
        await db.collection('posts').doc(postId).update({
            title: newTitle,
            content: newContent,
            preview: newContent.slice(0, 140)
        });
        closeEditModal();
        showToast("✏️ Post updated!");
    } catch (err) {
        console.error("Update error:", err);
        showToast("❌ Failed to update");
    }
}

function escapeHtml(str) { return str ? str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]) : ''; }

// Initialize Real-time Listener
listenToAdminPosts();
</script>
</body>
</html>
