<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BMD Admin Dashboard</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Fonts & Icons & Admin Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body style="background-color: #f4f6f5;">

<header class="app-header" style="background: linear-gradient(135deg, #0d1b12, #142e1f);">
    <div class="brand">
        <h1>BMD ADMIN PANEL</h1>
        <span class="sub">Control & Management Center</span>
    </div>
    <div class="actions">
        <button class="header-icon-btn" onclick="window.location.href='icon.html'" title="Icons & Quick Tools"><i class="fas fa-icons"></i></button>
        <button class="header-icon-btn" id="adminLogoutBtn" title="Log Out"><i class="fas fa-sign-out-alt"></i></button>
    </div>
</header>

    <main class="feed-container" style="margin-top: 20px;">
    <!-- Admin Quick Stats Section -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;">
        <div style="background: #ffffff; padding: 14px; border-radius: 12px; border-left: 4px solid var(--bmd-gold); box-shadow: var(--bmd-shadow-sm);">
            <div style="font-size: 0.7rem; color: #666; font-weight: 600;">TOTAL POSTS</div>
            <div id="statTotalPosts" style="font-size: 1.4rem; font-weight: 800; color: var(--bmd-primary);">--</div>
        </div>
        <div style="background: #ffffff; padding: 14px; border-radius: 12px; border-left: 4px solid #27ae60; box-shadow: var(--bmd-shadow-sm);">
            <div style="font-size: 0.7rem; color: #666; font-weight: 600;">COMMUNITY USERS</div>
            <div id="statTotalUsers" style="font-size: 1.4rem; font-weight: 800; color: #27ae60;">--</div>
        </div>
    </div>

    <!-- Navigation & Quick Access Buttons including icon.html -->
    <div style="background: #ffffff; padding: 14px; border-radius: 14px; margin-bottom: 16px; box-shadow: var(--bmd-shadow-sm);">
        <h3 style="font-size: 0.95rem; margin-bottom: 10px; color: var(--bmd-primary);"><i class="fas fa-toolbox"></i> Quick Actions</h3>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button onclick="window.location.href='icon.html'" style="flex: 1; min-width: 110px; padding: 10px; background: var(--bmd-primary); color: #fff; border: none; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                <i class="fas fa-icons"></i> Icon Panel
            </button>
            <button onclick="window.location.href='post.html'" style="flex: 1; min-width: 110px; padding: 10px; background: var(--bmd-gold); color: var(--bmd-dark); border: none; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                <i class="fas fa-plus-circle"></i> New Post
            </button>
        </div>
    </div>

    <!-- Admin Moderation List Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="font-size: 1rem; font-family: 'Playfair Display', serif; color: var(--bmd-primary);">Manage Submissions</h3>
        <button onclick="loadAdminPosts()" style="background: none; border: none; color: var(--bmd-primary); font-size: 0.75rem; font-weight: 700; cursor: pointer;"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <!-- Admin Feed Container for Moderation -->
    <div id="adminFeedWrapper">
        <div style="text-align:center; padding:30px; color:#666; font-size: 0.85rem;">Loading admin data...</div>
    </div>
    </main>

    <!-- Bottom Nav with Integrated icon.html Access -->
<nav class="bottom-nav">
    <button class="nav-link active" onclick="window.location.href='index.html'">
        <i class="fas fa-chart-pie"></i><span>Dashboard</span>
    </button>
    <button class="nav-link" onclick="window.location.href='icon.html'">
        <i class="fas fa-icons"></i><span>Icons</span>
    </button>
    <button class="nav-link post-create-btn" onclick="window.location.href='post.html'">
        <i class="fas fa-plus"></i><span>Post</span>
    </button>
    <button class="nav-link" onclick="window.location.href='account.html'">
        <i class="fas fa-user-shield"></i><span>Admin</span>
    </button>
</nav>

<div class="toast" id="toast"></div>

<!-- Admin Script Hook -->
<script src="admin.js"></script>
</body>
</html>
